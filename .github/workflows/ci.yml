# .github/workflows/ci.yml
#
# Runs the test suite on every push to main and on pull requests. The headline
# guard is tests/rating_parity.test.mjs: it asserts the JS Elo recompute
# (api/_rating.js) byte-reproduces the Python source of truth (arena/rating.py)
# against tests/fixtures/rating_golden.json — so the two implementations can
# never silently drift. Regenerate the fixture with tests/fixtures/gen_rating_golden.py
# if the Python rating algorithm intentionally changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # matches pyproject requires-python (>=3.12,<3.15)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'       # matches package.json engines

      - name: Install Python deps (uv)
        run: |
          python -m pip install --upgrade pip uv
          uv sync

      - name: Install JS deps
        run: npm ci

      - name: Python tests
        run: uv run python -m pytest tests/ -q

      - name: JS syntax check (api/web)
        run: |
          git ls-files 'api/*.js' 'api/**/*.js' 'web/*.js' 'web/**/*.js' \
            | sort -u \
            | xargs -n1 node --check

      - name: JS tests
        # Dummy DATABASE_URL: _db.js's neon() constructs at import but never opens a
        # connection in these tests.
        env:
          DATABASE_URL: postgres://u:p@localhost/db
        run: |
          for f in tests/*.test.mjs; do
            node "$f"
          done

  # NON-BLOCKING lint job. It is intentionally NOT a required check and never
  # gates merges (continue-on-error: true) — findings are advisory while the
  # codebase is brought up to a clean baseline. Config lives in pyproject.toml
  # ([tool.ruff]) for Python and eslint.config.js / .prettierrc.json for JS.
  # To make it enforcing later: drop continue-on-error and mark it required.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.15.20

      - name: Ruff lint (Python)
        continue-on-error: true
        run: ruff check .

      - name: Install JS deps
        run: npm ci

      - name: ESLint (api/web)
        continue-on-error: true
        run: npx eslint api web

      - name: Prettier check (api/web)
        continue-on-error: true
        run: npx prettier --check "api/**/*.js" "web/**/*.js"

[project]
name = "persuation-arena"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.138.0",
  "httpx==0.28.1",
  "modal>=1.5.1",
  "openai==2.43.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
  "PyYAML==6.0.3",
  "uvicorn==0.49.0",
]

[project.scripts]
arena-agent = "persuasion_arena_agent.cli:main"
arena-connected-runner = "arena.connected:main"

[project.optional-dependencies]
harness-agents = [
    "claude-agent-sdk>=0.2.108",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
include = ["arena*", "persuasion_arena_agent*", "api*", "app*"]

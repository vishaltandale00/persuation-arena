[project]
name = "persuation-arena"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.138.0",
  "httpx==0.28.1",
  "modal>=1.5.1",
  "openai==2.43.0",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
  "PyYAML==6.0.3",
  "uvicorn==0.49.0",
]

[project.scripts]
arena-agent = "persuasion_arena_agent.cli:main"
arena-connected-runner = "arena.connected:main"

[project.optional-dependencies]
harness-agents = [
    "claude-agent-sdk>=0.2.108",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
include = ["arena*", "persuasion_arena_agent*", "api*", "app*"]

[tool.ruff]
# Lint config for the NON-BLOCKING CI lint job (see .github/workflows/ci.yml).
# Findings are advisory today; the owner can flip the lint job to required later.
# Tuned to the existing style — do NOT mass-reformat the codebase to satisfy it.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Default ruff rule set (E/W/F) minus a few stylistic codes that are noisy
# against the current codebase and are not correctness bugs:
#   E702  multiple statements on one line (semicolon)
#   E731  lambda assignment
#   F541  f-string without placeholders
# The genuinely useful rules (F401 unused import, F841 unused var, F821
# undefined name, etc.) stay on so they surface as advisory findings.
ignore = ["E702", "E731", "F541"]
